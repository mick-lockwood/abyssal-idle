<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyssal Idle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Story Log Panel -->
        <div class="panel story-panel">
            <h2>The Abyss</h2>
            <p id="storyLog">A spark in the dark. The water is freezing, but the rock is warm. Grow.</p>
        </div>

        <!-- Core Game Panel -->
        <div class="panel main-panel">
            <div class="currencies">
                <h1 id="heatDisplay">Heat: 0</h1>
                <h3 id="biomassDisplay" class="hidden">Biomass Multiplier: x1</h3>
                <h3 id="mutationDisplay" class="hidden">Mutation Points: 0</h3>
            </div>

            <button id="ventClicker" class="clicker-btn" onclick="generateHeatClick(event)">
                Pulse Vent
            </button>

            <!-- Upgrades Store -->
            <div class="store">
                <h2>Oasis Upgrades</h2>
                <div class="upgrade-item">
                    <div>
                        <strong>Chemosynthetic Bacteria</strong>
                        <p id="bacteriaCost">Cost: 50 Heat</p>
                        <p id="bacteriaCount">Owned: 0</p>
                    </div>
                    <button onclick="buyUpgrade('bacteria')">Evolve</button>
                </div>
                
                <div class="upgrade-item">
                    <div>
                        <strong>Tube Worm Colony</strong>
                        <p id="tubeWormsCost">Cost: 500 Heat</p>
                        <p id="tubeWormsCount">Owned: 0</p>
                    </div>
                    <button onclick="buyUpgrade('tubeWorms')">Anchor</button>
                </div>
            </div>

            <!-- Prestige Reset -->
            <button id="prestigeBtn" class="prestige-btn hidden" onclick="prestige()">
                Collapse & Mutate (Requires 100,000 Heat)
            </button>
        </div>

        <!-- Skill Tree Panel -->
        <div id="skillTreePanel" class="panel skill-panel hidden">
            <h2>Mutation Tree</h2>
            <div class="skill-grid">
                <button id="skill_double_click" class="skill-btn" onclick="unlockSkill('double_click')">
                    <strong>Bifurcation</strong><br>
                    2x Click Power<br>
                    Cost: 1 MP
                </button>
                <button id="skill_heat_efficiency" class="skill-btn" onclick="unlockSkill('heat_efficiency')">
                    <strong>Thermal Efficiency</strong><br>
                    2x Passive Heat<br>
                    Cost: 2 MP
                </button>
                <button id="skill_cheaper_bacteria" class="skill-btn" onclick="unlockSkill('cheaper_bacteria')">
                    <strong>Symbiosis</strong><br>
                    Bacteria cost -20%<br>
                    Cost: 3 MP
                </button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
